services:
  weather-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: weather-pipeline-api:latest
    container_name: weather-pipeline-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist the append-only audit log across container restarts/rebuilds.
      - audit-log-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  audit-log-data:
