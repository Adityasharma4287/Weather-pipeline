[project]
name = "weather-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "pyjwt>=2.8",
    "numpy>=1.26",
    "xarray>=2024.1",
    "pandas>=2.0",
    "scipy>=1.11",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2",
]

[tool.vercel]
entrypoint = "src.api.main:app"
